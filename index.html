<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bài thi trắc nghiệm</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 20px;
}

.wrapper{
    width:100%;
    max-width:900px;
}

.header{
    background:#fff;
    border-top:8px solid #673ab7;
    border-radius:12px;
    padding:35px;
    margin-bottom:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header h1{
    font-size:42px;
    line-height:1.3;
}

.question{
    background:#fff;
    border-radius:12px;
    padding:30px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.question-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.option{
    display:flex;
    align-items:flex-start;
    margin:18px 0;
}

.option input{
    transform:scale(1.4);
    margin-right:15px;
    margin-top:5px;
}

.option label{
    font-size:22px;
    line-height:1.6;
    cursor:pointer;
}

.form-box{
    background:#fff;
    border-radius:12px;
    padding:30px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    margin-bottom:30px;
}

.form-box input{
    width:100%;
    padding:16px;
    margin-bottom:18px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:18px;
    font-size:24px;
    background:#1565c0;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

/* Hoa rơi */

.flower{
    position:fixed;
    top:-50px;
    pointer-events:none;
    z-index:9999;
    animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:.9;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:.3;
}
}

@media(max-width:768px){

.header h1{
font-size:30px;
}

.question-title{
font-size:22px;
}

.option label{
font-size:18px;
}

button{
font-size:20px;
}

}

</style>

</head>

<body>

<div class="wrapper">

<div class="header">
<h1>
BÀI THI TRẮC NGHIỆM VỀ GIAO TIẾP, ỨNG XỬ<br>
CỦA NHÂN VIÊN Y TẾ NĂM 2026 LẦN 1
</h1>
</div>

<div id="question-container"></div>

<div class="form-box">
<input type="text" id="hoten" placeholder="Nhập họ và tên">
<input type="text" id="sdt" placeholder="Nhập số điện thoại">

<button id="btnSubmit" onclick="nopBai()">
Nộp bài
</button>
</div>

<script src="questions.js"></script>

<script>

/* GIỮ NGUYÊN TOÀN BỘ PHẦN JAVASCRIPT CỦA BẠN
   từ dòng:
   const SCRIPT_URL = "...";
   đến hết file */

</script>

</div>

</body>
</html>
