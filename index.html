<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả bài thi - NVYT 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      background: #f0eef7;
      color: #202124;
      padding: 24px 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 520px;
      width: 100%;
    }
    .result-card {
      background: white;
      border-radius: 12px;
      border-top: 10px solid #673ab7;
      padding: 32px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-align: center;
    }
    .result-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #202124;
    }
    .subtitle {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 28px;
    }
    .score-box {
      background: #f3e8ff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .score-label {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 6px;
    }
    .score-value {
      font-size: 48px;
      font-weight: 700;
      color: #673ab7;
      line-height: 1.1;
    }
    .score-max {
      font-size: 20px;
      color: #5f6368;
      font-weight: 500;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #5f6368;
    }
    .info-value {
      font-weight: 500;
      color: #202124;
    }
    .btn-back {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      background: #673ab7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-back:hover {
      background: #5e35b1;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
    }
    .status.pass {
      background: #e6f4ea;
      color: #137333;
    }
    .status.fail {
      background: #fce8e6;
      color: #c5221f;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="result-card">
      <h1>Kết quả bài thi</h1>
      <div class="subtitle">Giao tiếp & Ứng xử NVYT - Tháng 8/2026</div>

      <div class="score-box">
        <div class="score-label">Điểm số của bạn</div>
        <div class="score-value">
          <span id="diem">0</span>
          <span class="score-max">/ 100</span>
        </div>
      </div>

      <div class="info-row">
        <span class="info-label">Họ và tên</span>
        <span class="info-value" id="hoten">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Chức danh</span>
        <span class="info-value" id="cd">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Số câu đúng</span>
        <span class="info-value" id="dung">—</span>
      </div>

      <div id="status" class="status"></div>

      <a href="index.html" class="btn-back">Làm lại bài thi</a>
    </div>
  </div>

  <script>
    // Lấy dữ liệu từ URL
    const params = new URLSearchParams(window.location.search);

    const hoten = params.get("hoten") || "Không có dữ liệu";
    const cd    = params.get("cd") || "—";
    const diem  = params.get("diem") || "0";
    const dung  = params.get("dung") || "0";

    // Hiển thị lên trang
    document.getElementById("hoten").textContent = hoten;
    document.getElementById("cd").textContent = cd;
    document.getElementById("diem").textContent = diem;
    document.getElementById("dung").textContent = dung + " câu";

    // Đánh giá đạt / không đạt (ví dụ: >= 70 điểm là đạt)
    const statusEl = document.getElementById("status");
    const diemSo = Number(diem);

    if (diemSo >= 70) {
      statusEl.textContent = "Đạt yêu cầu";
      statusEl.classList.add("pass");
    } else {
      statusEl.textContent = "Chưa đạt yêu cầu";
      statusEl.classList.add("fail");
    }
  </script>
</body>
</html>
