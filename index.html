<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website của tôi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Website của tôi</h1>
    <nav>
      <a href="#home">Trang chủ</a>
      <a href="#about">Giới thiệu</a>
      <a href="#contact">Liên hệ</a>
    </nav>
  </header>

  <main>
    <!-- Trang chủ -->
    <section id="home">
      <h2>Chào mừng!</h2>
      <p>Đây là website chạy trên GitHub Pages, hiển thị đẹp trên mọi thiết bị.</p>
    </section>

    <!-- Giới thiệu - có form các trường dữ liệu -->
    <section id="about">
      <h2>Giới thiệu</h2>
      
      <form class="form-gioi-thieu">
        <div class="form-group">
          <label for="hoten">Họ và tên</label>
          <input type="text" id="hoten" name="hoten" placeholder="Nhập họ và tên" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Nhập email" required>
        </div>

        <div class="form-group">
          <label for="sdt">Số điện thoại</label>
          <input type="tel" id="sdt" name="sdt" placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
          <label for="ngaysinh">Ngày sinh</label>
          <input type="date" id="ngaysinh" name="ngaysinh">
        </div>

        <div class="form-group">
          <label for="ghichu">Ghi chú</label>
          <textarea id="ghichu" name="ghichu" rows="4" placeholder="Nhập ghi chú..."></textarea>
        </div>

        <button type="submit">Gửi thông tin</button>
      </form>
    </section>

    <!-- Liên hệ -->
    <section id="contact">
      <h2>Liên hệ</h2>
      <p>Email: example@email.com</p>
    </section>
  </main>

  <footer>
    <p>© 2026 - Tạo bằng GitHub Pages</p>
  </footer>
</body>
</html>
