<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bài thi trắc nghiệm</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f8;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:40px 20px;
}

.wrapper{
    width:100%;
    max-width:900px;
}

.header{
    background:#fff;
    border-radius:12px;
    padding:35px;
    margin-bottom:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    border-top:8px solid #5E35B1;
}

.header h1{
    font-size:42px;
    line-height:1.3;
    font-weight:bold;
}

.question{
    background:#fff;
    border-radius:12px;
    padding:30px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.question-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:22px;
}

.option{
    display:flex;
    align-items:flex-start;
    margin:18px 0;
}

.option input{
    margin-right:16px;
    margin-top:5px;
    transform:scale(1.5);
}

.option label{
    font-size:23px;
    line-height:1.7;
    cursor:pointer;
}

.form-info{
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.form-info input{
    width:100%;
    font-size:22px;
    padding:18px;
    margin-bottom:20px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:18px;
    font-size:24px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

@media(max-width:768px){

.header h1{
    font-size:30px;
}

.question-title{
    font-size:22px;
}

.option label{
    font-size:18px;
}

button{
    font-size:20px;
}

}

.flower{
    position:fixed;
    top:-50px;
    z-index:9999;
    pointer-events:none;
    animation:fall linear infinite;
    opacity:.8;
}

@keyframes fall{

0%{
transform:translateY(0) rotate(0);
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:.3;
}

}

</style>

</head>
